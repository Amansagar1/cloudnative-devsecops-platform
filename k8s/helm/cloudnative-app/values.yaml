# Default values for cloudnative-app Helm chart.

global:
  environment: production

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/amansagar1/cloudnative-devsecops-platform/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/amansagar1/cloudnative-devsecops-platform/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: "nginx"
  host: "app.devops.local"

database:
  host: "postgres-service"
  port: 5432
  name: "devops_db"

redis:
  url: "redis://redis-service:6379"
